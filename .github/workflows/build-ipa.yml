name: Build Unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Generate app icon
        run: python3 Tools/make_icon.py PlayerBox/Assets.xcassets/AppIcon.appiconset/icon-1024.png

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install CocoaPods
        run: |
          if ! command -v pod >/dev/null 2>&1; then
            sudo gem install cocoapods --no-document
          fi
          pod --version

      - name: Install VLC pods
        id: pods
        continue-on-error: true
        run: |
          set +e
          pod install --verbose > pod.log 2>&1
          echo "POD_EXIT_CODE=$?" >> pod.log
          tail -n 30 pod.log

      - name: Build app
        id: build
        if: steps.pods.outcome == 'success'
        continue-on-error: true
        run: |
          set +e
          xcodebuild \
            -workspace PlayerBox.xcworkspace \
            -scheme PlayerBox \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1
          echo "EXIT_CODE=$?" >> build.log
          tail -n 80 build.log

      - name: Publish build report
        if: always()
        run: |
          {
            echo "# Build report"
            echo ""
            echo "时间：$(date -u)"
            echo ""
            if [ -f pod.log ]; then
              echo "## pod install"
              echo '```'
              grep -nE "error|Error|Installing|Downloading|POD_EXIT_CODE|Unable|failed" pod.log | head -40 || true
              echo '```'
              echo ""
            fi
            echo "## xcodebuild"
            echo '```'
            grep -nE "error:|warning:|BUILD FAILED|BUILD SUCCEEDED|The following build commands failed|EXIT_CODE" build.log | head -120 || true
            echo '```'
            echo ""
            echo "## 日志尾部"
            echo '```'
            tail -n 40 build.log || true
            echo '```'
          } > build-report.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-report.md
          git commit -m "ci: build report [skip ci]" || true
          git push || true

      - name: Package IPA
        if: steps.build.outcome == 'success'
        run: |
          set -e
          APP_PATH="build/Build/Products/Release-iphoneos/PlayerBox.app"
          ls -la "$APP_PATH"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr PlayerBox-unsigned.ipa Payload
          ls -lh PlayerBox-unsigned.ipa

      - name: Upload artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: PlayerBox-unsigned-ipa
          path: PlayerBox-unsigned.ipa

      - name: Publish release
        if: steps.build.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PlayerBox build ${{ github.run_number }}
          body: |
            未签名 IPA（VLC 内核），构建自 ${{ github.sha }}
            安装前需自行签名（全能签 / Sideloadly / ESign / AltStore）。
          files: PlayerBox-unsigned.ipa
          draft: false
          prerelease: false
